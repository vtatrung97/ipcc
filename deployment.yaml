apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipcc-microfrontend-deployment
  labels:
    app: ipcc-microfrontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipcc-microfrontend
  template:
    metadata:
      labels:
        app: ipcc-microfrontend
    spec:
      containers:
      - name: ipcc-microfrontend
        image: ipcc-microfrontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
