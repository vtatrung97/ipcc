server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Cấu hình cho Host App (ipcc) tại route /
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cho Remote App (process) tại route /process/
    location /process/ {
        alias /usr/share/nginx/html/process/;
        try_files $uri $uri/ /process/index.html;

        # CORS Headers cho Module Federation (remoteEntry.js và các chunk JS)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    }

    # Cấu hình header và cache cho các static assets (JS, CSS, images, font)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
