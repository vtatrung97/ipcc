<div class="enterprise-shell">
  <!-- Left Aside / Sidebar with Toggle Button on ProcessX -->
  <app-aside [collapsed]="isCollapsed" (toggleCollapse)="toggleSidebar()"></app-aside>

  <!-- Right Application Shell -->
  <div class="enterprise-viewport">
    <!-- Top-bar Header -->
    <app-top-bar [collapsed]="isCollapsed"></app-top-bar>

    <!-- Dynamic Router Outlet for Pages -->
    <main class="enterprise-body">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer Copyright -->
    <app-footer></app-footer>
  </div>
</div>
